name: CI
on:
  pull_request:
  push:
    branches: [main, nguyen-1]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('backend/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - if: ${{ hashFiles('backend/pom.xml') != '' }}
        run: cd backend && sh ./mvnw -B verify

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('worker/go.mod') != '' }}
        uses: actions/setup-go@v5
        with: { go-version-file: worker/go.mod }
      - if: ${{ hashFiles('worker/go.mod') != '' }}
        run: cd worker && go vet ./... && go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: ${{ hashFiles('frontend/package.json') != '' }}
        run: cd frontend && npm ci && npm run build --if-present && npm test --if-present

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra script deploy không tự bật compute khi hạ tải
        run: |
          bash -n scripts/deploy-api.sh
          bash -n scripts/bump-worker-tag.sh
          bash tests/deploy/dormant.sh
      - if: ${{ hashFiles('infra/terraform/envs/dev/*.tf') != '' }}
        uses: hashicorp/setup-terraform@v3
      - if: ${{ hashFiles('infra/terraform/envs/dev/*.tf') != '' }}
        run: |
          terraform fmt -check -recursive infra/terraform
          cd infra/terraform/envs/dev && terraform init -backend=false && terraform validate

  deploy:
    needs: [backend, worker, frontend, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/nguyen-1'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml

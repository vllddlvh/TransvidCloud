server {
    listen 80;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }

    location /media/ {
        set $s3 http://localstack:4566;
        rewrite ^/media/(.*)$ /tvc-local-output/$1 break;
        proxy_pass $s3;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

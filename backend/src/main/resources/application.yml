server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: transvidcloud-backend
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-southeast-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      s3:
        path-style-access-enabled: ${S3_PATH_STYLE_ENABLED:true}

tvc:
  aws:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    s3:
      input-bucket: ${S3_BUCKET_INPUT:${TVC_INPUT_BUCKET:tvc-local-input}}
      output-bucket: ${S3_BUCKET_OUTPUT:${TVC_OUTPUT_BUCKET:tvc-local-output}}
      presign-endpoint: ${S3_PRESIGN_ENDPOINT:http://localhost:4566}
      presign-ttl-minutes: 15
    sqs:
      jobs-queue-name: ${SQS_QUEUE_NAME:${TVC_JOBS_QUEUE_URL:tvc-local-jobs}}
    dynamodb:
      table-prefix: ${DDB_TABLE_PREFIX:tvc-local-}
  upload:
    max-bytes: ${MAX_UPLOAD_BYTES:209715200}
    allowed-content-types:
      - video/mp4
      - video/quicktime
      - video/x-matroska
      - video/webm
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-must-be-at-least-32-bytes-long}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000}
  media:
    base-url: ${TVC_MEDIA_BASE_URL:/media}
  logging:
    format: ${LOG_FORMAT:text}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
